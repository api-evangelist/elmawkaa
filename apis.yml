name: Elmawkaa
description: >-
  Elmawkaa (الموقع) is an Egyptian B2B online marketplace that digitizes
  construction-materials procurement. Founded in Cairo in 2017 by Ebrahem Anwar,
  Mahmoud Habib, and Mohamed Thabet, the platform lets construction companies
  request and compare competitive supplier quotations for materials such as
  cement, steel, and gypsum board, using proprietary matching algorithms to
  replace slow, manual bidding with a documented, automated process. A 500
  Startups (500 Global) accelerator graduate that raised a seed round led by
  Flat6Labs with Oqal and other regional backers, Elmawkaa was fully acquired by
  Saudi PropTech / real-estate-appraisal platform Ayen in a seven-figure deal in
  October 2024, with its marketplace folded into Ayen's services. Elmawkaa
  publishes no public developer API, SDKs, or documentation, and its standalone
  domain (elmawkaa.com) no longer resolves following the acquisition.
